services:
  - type: web
    name: crisisaid
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEWS_API_KEY
        sync: false
      - key: NEWS_API_URL
        value: https://newsapi.org/v2/everything
